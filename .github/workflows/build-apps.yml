name: NEXCHAT installers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexchat-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web:
    name: Web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build web
        run: pnpm --filter @nexchat/web build
      - uses: actions/upload-artifact@v4
        with:
          name: nexchat-web
          path: apps/web/dist/
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Generate NEXCHAT icons
        run: pnpm --filter @nexchat/desktop exec tauri icon src-tauri/icons/nexchat.svg
      - name: Copy app icon
        run: mkdir -p apps/mobile/assets && cp apps/desktop/src-tauri/icons/icon.png apps/mobile/assets/icon.png
      - name: Generate Android project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install
      - name: Build installable debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: nexchat-android-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  ios-simulator:
    name: iOS Simulator build (not for physical iPhone)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Generate iOS project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform ios
      - name: Generate NEXCHAT icons
        run: pnpm --filter @nexchat/desktop exec tauri icon src-tauri/icons/nexchat.svg
      - name: Copy app icon
        run: mkdir -p apps/mobile/assets && cp apps/desktop/src-tauri/icons/icon.png apps/mobile/assets/icon.png
      - name: Build iOS Simulator app
        working-directory: apps/mobile
        run: |
          xcodebuild -project ios/NEXCHAT.xcodeproj -scheme NEXCHAT -sdk iphonesimulator -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          cd build/Build/Products/Debug-iphonesimulator
          ditto -c -k --sequesterRsrc --keepParent NEXCHAT.app NEXCHAT-iOS-Simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: nexchat-ios-simulator
          path: apps/mobile/build/Build/Products/Debug-iphonesimulator/NEXCHAT-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Generate NEXCHAT icons
        run: pnpm --filter @nexchat/desktop exec tauri icon src-tauri/icons/nexchat.svg
      - name: Build Windows installers
        run: pnpm --filter @nexchat/desktop build
      - uses: actions/upload-artifact@v4
        with:
          name: nexchat-windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS disk image
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Generate NEXCHAT icons
        run: pnpm --filter @nexchat/desktop exec tauri icon src-tauri/icons/nexchat.svg
      - name: Build macOS app
        run: pnpm --filter @nexchat/desktop build
      - uses: actions/upload-artifact@v4
        with:
          name: nexchat-macos
          path: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
